name: Update listings

on:
  schedule:
    # 4 checks a day (UTC): ≈ 7h, 11h, 15h, 19h in Lyon (winter time)
    - cron: "0 6,10,14,18 * * *"
  workflow_dispatch: {}   # "Run workflow" button = manual check

permissions:
  contents: write

concurrency:
  group: update-listings
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch listings
        env:
          # Only needed if sources.email_alerts.enabled is true in config.yaml
          APT_IMAP_PASSWORD: ${{ secrets.APT_IMAP_PASSWORD }}
        run: |
          # scheduled runs start at a random minute (be gentle with the sites)
          if [ "${{ github.event_name }}" = "schedule" ]; then sleep $((RANDOM % 600)); fi
          python run.py

      - name: Commit if changed (Netlify redeploys on push)
        run: |
          git config user.name "listings-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/listings.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "Update listings $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase --autostash
          git push
