# AppartHunter settings (no secrets here: the e-mail password comes from an env var / GitHub secret).

# Places to live close to. The commute is computed to the FARTHEST one, so if your
# daughters go to different sites, list both. Remove the one you don't need.
targets:
  - name: "Chevreul Lestonnac — collège/lycée (bd des Tchécoslovaques)"
    address: "Boulevard des Tchécoslovaques 69007 Lyon"
    lat: 45.74914     # pinned from OpenStreetMap (the address search alone is imprecise)
    lon: 4.85889
  # - name: "Chevreul Lestonnac — site rue Chevreul"
  #   address: "7 rue Chevreul 69007 Lyon"

# Also keep flats a short walk from these stations (positions from OpenStreetMap).
corridors:
  - name: "Metro D"
    # Garibaldi → Grange Blanche
    walk_minutes: 5
    stops:
      - {name: "Garibaldi", lat: 45.751622, lon: 4.853488}
      - {name: "Sans Souci", lat: 45.747584, lon: 4.865247}
      - {name: "Monplaisir - Lumière", lat: 45.745521, lon: 4.871377}
      - {name: "Grange Blanche", lat: 45.742997, lon: 4.87888}
  - name: "Tram T4"
    # ≈ 10 min ride from school: Lycée Colbert → Charpennes (nothing south: no Jet d'eau)
    walk_minutes: 5
    stops:
      - {name: "Lycée Colbert", lat: 45.745681, lon: 4.85908}
      - {name: "Manufacture Montluc", lat: 45.750176, lon: 4.860378}
      - {name: "Archives Départementales", lat: 45.754363, lon: 4.861825}
      - {name: "Gare Part-Dieu - Villette", lat: 45.76078, lon: 4.861982}
      - {name: "Thiers - Lafayette", lat: 45.76433, lon: 4.862073}
      - {name: "Collège Bellecombe", lat: 45.766696, lon: 4.861965}
      - {name: "Charpennes - Charles Hernu", lat: 45.77095, lon: 4.863054}

commute:
  ideal_minutes: 20   # walk or public transport: listings within this rank first
  max_minutes: 30     # "a little farther": still shown, ranked lower; beyond = dropped

search:
  transaction: rent           # rent | buy
  property_types: [flat]
  cities: [Lyon, Villeurbanne, Vénissieux, Saint-Fons, Bron]  # covers the 30-min zone around Lyon 7e
  min_rooms: 3              # fetch T3 → T5; the app shows T4 (3 bedrooms) by default
  max_rooms: 5
  min_price: null
  max_price: 2000             # € upper bound for fetching; refine in the app
  parking: preferred          # required | preferred | any
  garage: any                 # required | preferred | any  (closed garage / box)
  colocation_min_rooms: 3     # keep flatshare ads of 3+ rooms (ask for the whole flat); null = exclude all

# How listings are ranked (relative weights, 0 disables).
scoring:
  commute: 5
  price: 3
  price_per_m2: 1
  parking: 2
  garage: 1
  freshness: 1

sources:
  favorites:
    enabled: true
    file: favorites.json      # your SeLoger / Leboncoin favourites, copied from your browser
  seloger_scan:
    enabled: true
    file: seloger_scan.txt    # SeLoger results read from your browser by Claude, on request
    max_age_days: 21          # older scans are ignored (listings may be gone)
  bienici:
    enabled: true
    max_pages: 12             # 50 listings/page, newest first
    delay_seconds: [3, 8]     # random pause between requests (be polite)

  # Leboncoin, SeLoger, PAP, Logic-Immo, Figaro Immo... block automated access.
  # Instead: save a search with e-mail alerts on each site; this source reads
  # those alert e-mails from your mailbox (IMAP, read-only).
  email_alerts:
    enabled: false
    imap_host: imap.gmail.com
    username: you@gmail.com
    password_env: APT_IMAP_PASSWORD   # Gmail "app password", exported in this env var
    folder: INBOX
    days_back: 7

output:
  db: data/listings.sqlite
  json: web/public/listings.json   # cache read by the web app
